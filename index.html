<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy 1 Month ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(
        180deg,
        #ffd6e7,
        #ffeaf4,
        #fff5fa
    );
    text-align:center;
    font-family:sans-serif;
}

h1{
    margin-top:20px;
}

#counter{
    font-size:24px;
}

.heart{
    position:absolute;
    font-size:40px;
    cursor:pointer;
    user-select:none;
}

#message{
    margin-top:20px;
    font-size:24px;
}
</style>

</head>
<body>

<h1>Happy 1 Month ❤️</h1>
<p>เก็บหัวใจให้ครบ 20 ดวง 💕</p>

<div id="counter">0 / 20</div>

<div id="message"></div>

<script>
let score = 0;

for(let i=0;i<20;i++){

    let heart = document.createElement("div");

    heart.innerHTML = "❤️";
    heart.className = "heart";

    heart.style.left = Math.random()*90 + "%";
    heart.style.top = Math.random()*80 + "%";

    heart.onclick = function(){

        this.remove();

        score++;

        document.getElementById("counter").innerHTML =
        score + " / 20";

        if(score == 20){
            document.getElementById("message").innerHTML =
            "💌 Happy 1 Month 

Thank you for being the reason behind my smile every single day.

Thank you for coming into my life and making it brighter.

Love P'Eng , jub jub 😽🫶🏻🤍";
        }
    }

    document.body.appendChild(heart);
}
</script>

</body>
</html>
